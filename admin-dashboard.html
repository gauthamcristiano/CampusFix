<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | CampusFix</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#0a2540}
header{background:#0a2540;color:white;padding:20px 6%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
header h2{margin:0}
header span{color:#00b4d8}
button{cursor:pointer}
.logout{background:transparent;color:white;border:1px solid white;padding:10px 18px;border-radius:7px}
main{max-width:1250px;margin:35px auto;padding:0 20px}
.heading{margin-bottom:25px}
.heading p{color:#64748b}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:28px}
.stat{background:white;padding:23px;border-radius:12px;box-shadow:0 4px 18px #0a254010}
.stat p{color:#64748b;margin:0 0 12px}
.stat h2{font-size:30px;margin:0}
.card{background:white;padding:25px;border-radius:14px;box-shadow:0 4px 18px #0a254010}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
select{padding:10px;border:1px solid #dbe3ed;border-radius:7px}
.report{border:1px solid #e2e8f0;border-radius:10px;padding:20px;margin-top:17px}
.report h3{margin:12px 0}
.badge{display:inline-block;padding:6px 11px;border-radius:20px;font-size:12px;font-weight:bold;background:#e0f2fe;color:#075985}
.approve{background:#dcfce7;color:#166534}
.escalate{background:#fee2e2;color:#991b1b}
.reject{background:#f1f5f9;color:#475569}
.meta{font-size:14px;color:#64748b;line-height:1.7}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}
.actions button{padding:9px 13px;border:0;border-radius:7px;background:#0a2540;color:white}
.actions button:hover{background:#005b60}
.empty{color:#64748b;padding:25px 0}
@media(max-width:750px){.stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:420px){.stats{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<h2>Campus<span>Fix</span> | Admin Control Center</h2>
<button class="logout" id="logout">Logout</button>
</header>

<main>

<section class="heading">
<h1>Admin Dashboard</h1>
<p>Monitor campus complaints and manage Tefi AI inspection results.</p>
</section>

<section class="stats">
<div class="stat"><p>Total Complaints</p><h2 id="total">0</h2></div>
<div class="stat"><p>Approved</p><h2 id="approved">0</h2></div>
<div class="stat"><p>Under Review</p><h2 id="review">0</h2></div>
<div class="stat"><p>Urgent Alerts</p><h2 id="urgent">0</h2></div>
</section>

<section class="card">
<div class="toolbar">
<div>
<h2>Complaint Management</h2>
<p class="meta">All complaints submitted from this browser.</p>
</div>

<select id="filter">
<option value="ALL">All Complaints</option>
<option value="APPROVE">Approved</option>
<option value="REJECT">Rejected</option>
<option value="ESCALATE">Urgent Alerts</option>
</select>
</div>

<div id="reports"></div>
</section>

</main>

<script>
const admin = sessionStorage.getItem("campusfixAdmin");

if (!admin) {
  window.location.href = "admin-login.html";
}

const storageKey = "campusfix-demo-reports";

function getReports() {
  return JSON.parse(localStorage.getItem(storageKey) || "[]");
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[char]);
}

function renderDashboard() {
  const reports = getReports();

  document.getElementById("total").textContent = reports.length;
  document.getElementById("approved").textContent =
    reports.filter(r => r.decision === "APPROVE").length;
  document.getElementById("review").textContent =
    reports.filter(r => r.decision === "REJECT").length;
  document.getElementById("urgent").textContent =
    reports.filter(r => r.decision === "ESCALATE").length;

  const filter = document.getElementById("filter").value;
  const filtered = reports.map((r,i) => ({...r,index:i})).filter(r =>
    filter === "ALL" || r.decision === filter
  ).reverse();

  const container = document.getElementById("reports");

  if (!filtered.length) {
    container.innerHTML = '<p class="empty">No complaints found. Student submissions will appear here.</p>';
    return;
  }

  container.innerHTML = filtered.map(r => {
    const badgeClass = r.decision === "APPROVE" ? "approve" :
                       r.decision === "ESCALATE" ? "escalate" : "reject";

    return `
      <div class="report">
        <span class="badge ${badgeClass}">${escapeHTML(r.decision || "SUBMITTED")}</span>
        <h3>${escapeHTML(r.category)}</h3>
        <p>${escapeHTML(r.message)}</p>
        <div class="meta">
          <strong>Student:</strong> ${escapeHTML(r.student)}<br>
          <strong>Email:</strong> ${escapeHTML(r.studentEmail)}<br>
          <strong>Location:</strong> ${escapeHTML(r.location)}<br>
          <strong>Priority:</strong> ${escapeHTML(r.priority || "Not assigned")}<br>
          <strong>Suggested Team:</strong> ${escapeHTML(r.suggestedTeam || "Not assigned")}<br>
          <strong>Tefi's Reason:</strong> ${escapeHTML(r.reason || "No reason provided")}<br>
          <strong>Current Status:</strong> ${escapeHTML(r.status || "Submitted")}
        </div>

        <div class="actions">
          <button onclick="updateStatus(${r.index},'In Progress')">In Progress</button>
          <button onclick="updateStatus(${r.index},'Resolved')">Resolved</button>
          <button onclick="updateStatus(${r.index},'Closed')">Close</button>
        </div>
      </div>
    `;
  }).join("");
}

function updateStatus(index,status) {
  const reports = getReports();
  if (!reports[index]) return;

  reports[index].status = status;
  localStorage.setItem(storageKey,JSON.stringify(reports));
  renderDashboard();
}

document.getElementById("filter").addEventListener("change",renderDashboard);

document.getElementById("logout").addEventListener("click",() => {
  sessionStorage.removeItem("campusfixAdmin");
  window.location.href = "admin-login.html";
});

renderDashboard();
</script>

</body>
</html>
