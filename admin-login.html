<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | CampusFix</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #071a2e;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 15px 50px rgba(0,0,0,.25);
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #0a2540;
    }
    .logo span { color: #00a6c7; }
    .subtitle { color: #64748b; line-height: 1.5; }
    h2 { color: #0a2540; margin-top: 30px; }
    label {
      display: block;
      margin: 20px 0 8px;
      font-weight: bold;
      color: #334155;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #dbe3ed;
      border-radius: 9px;
      font-size: 15px;
    }
    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 9px;
      background: #005b60;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #0a2540; }
    .error { color: #dc2626; font-size: 14px; }
    .demo {
      margin-top: 22px;
      padding: 15px;
      background: #f0f9ff;
      border-radius: 9px;
      color: #334155;
      font-size: 13px;
      line-height: 1.8;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      text-decoration: none;
      color: #64748b;
      font-size: 14px;
    }
    .admin-tag {
      display: inline-block;
      margin-top: 15px;
      background: #e0f2fe;
      color: #075985;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="login-box">
  <div class="logo">Campus<span>Fix</span></div>
  <div class="admin-tag">ADMINISTRATOR ACCESS</div>

  <h2>Admin Login</h2>
  <p class="subtitle">Sign in to manage campus complaints and review Tefi AI decisions.</p>

  <form id="adminForm">
    <label for="email">Admin Email</label>
    <input type="email" id="email" placeholder="Enter admin email" required>

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter password" required>

    <button type="submit">Access Admin Dashboard →</button>
    <p class="error" id="error"></p>
  </form>

  <div class="demo">
    <strong>Demo Admin Account</strong><br>
    Email: admin@campusfix.demo<br>
    Password: admin123
  </div>

  <a href="index.html" class="back">← Back to CampusFix</a>
</div>

<script>
  document.getElementById("adminForm").addEventListener("submit", function(e) {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (email === "admin@campusfix.demo" && password === "admin123") {
      sessionStorage.setItem("campusfixAdmin", email);
      window.location.href = "admin-dashboard.html";
    } else {
      document.getElementById("error").textContent =
        "Invalid admin credentials. Please try again.";
    }
  });
</script>

</body>
</html>
